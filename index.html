<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MF Pulse" />
    <meta name="theme-color" content="#090d16" />
    <title>MF Pulse - Mutual Fund Portfolio</title>
    <!-- Netlify & Third-Party Script Crash Shield -->
    <script>
      window.addEventListener('error', function (event) {
        if (event.filename && (event.filename.includes('netlify') || event.filename.includes('identity.netlify.com'))) {
          event.preventDefault();
          console.warn('[Netlify Shield] Prevented crash from external injected script:', event.message);
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && String(event.reason).includes('netlify')) {
          event.preventDefault();
          console.warn('[Netlify Shield] Prevented crash from external promise rejection:', event.reason);
        }
      });
    </script>

    <!-- PWA Watchdog: Prevent Stuck Blank Screen on Android/iOS Launch -->
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            console.warn('[PWA Watchdog] Blank screen detected after 3.5s. Clearing SW cache and auto-reloading...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                registrations.forEach(function (reg) { reg.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (name) { caches.delete(name); });
              });
            }
            window.location.reload(true);
          }
        }, 3500);
      });
    </script>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased overscroll-y-none select-none md:select-text">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
